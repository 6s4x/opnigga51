name: Auto Token Harvester

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Amount of tokens to generate'
        required: true
        default: '20'
      workers:
        description: 'Parallel workers (1-10)'
        required: true
        default: '4'

jobs:
  harvest:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir playwright
          python -m playwright install --no-shell chromium

      - name: Run Harvester
        run: |
          python gh_generator.py ${{ github.event.inputs.amount }} ${{ github.event.inputs.workers }}

      - name: Upload tokens artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokens-pool
          path: tokens.json
