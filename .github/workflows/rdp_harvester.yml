name: GitHub RDP Token Harvester

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Amount of tokens to harvest'
        required: true
        default: '100'
      workers:
        description: 'Parallel workers (1-16)'
        required: true
        default: '8'

jobs:
  rdp_harvest:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Enable Remote Desktop (Ngrok Optional)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0

      - name: Max Harvester Execution
        run: |
          python gh_generator.py ${{ github.event.inputs.amount }} ${{ github.event.inputs.workers }}

      - name: Save & Push Tokens to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-harvested ${{ github.event.inputs.amount }} tokens [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tokens artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokens
          path: tokens.json
